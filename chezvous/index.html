<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QLC リモートコンシェルジュ</title>
<style>
html, body { margin:0!important; padding:0!important; width:100%!important; height:100%!important; overflow:hidden!important; background-color:#0B1626; }
iframe { width:100%!important; height:100%!important; border:none!important; display:block!important; }
</style>
</head>
<body>
<iframe id="appFrame" src="" allow="camera; microphone; geolocation"></iframe>
<script>
(function(){
  var PC_URL = "https://script.google.com/a/qlc-service.com/macros/s/AKfycbw4spL1Wm0KSsSxt1jhSCpSUntxIpo2TyJTDSBCEteA9eRbJi0vpcw3AaY9LLW_TXL_pg/exec?id=chezvous";
  var SP_URL = "https://script.google.com/a/qlc-service.com/macros/s/AKfycbw4spL1Wm0KSsSxt1jhSCpSUntxIpo2TyJTDSBCEteA9eRbJi0vpcw3AaY9LLW_TXL_pg/exec?id=chezvous&mode=mobile";
  function isPhone(){
    var w = window.innerWidth || document.documentElement.clientWidth || 0;
    var portrait = window.innerHeight > window.innerWidth;
    return (w > 0 && w <= 760) || (portrait && w <= 900);
  }
  document.getElementById("appFrame").src = isPhone() ? SP_URL : PC_URL;
})();
</script>
</body>
</html>
