<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QLC リモートコンシェルジュ</title>
<style>
html, body { margin:0!important; padding:0!important; width:100%!important; height:100%!important; overflow:hidden!important; background-color:#0B1626; }
iframe { width:100%!important; height:100%!important; border:none!important; display:block!important; }
</style>
</head>
<body>
<iframe id="appFrame" src="" allow="camera; microphone; geolocation"></iframe>
<script>
(function(){
  var PC_URL = "https://script.google.com/a/qlc-service.com/macros/s/AKfycbw4spL1Wm0KSsSxt1jhSCpSUntxIpo2TyJTDSBCEteA9eRbJi0vpcw3AaY9LLW_TXL_pg/exec?id=qlc-0000";
  var SP_URL = "https://script.google.com/a/qlc-service.com/macros/s/AKfycbw4spL1Wm0KSsSxt1jhSCpSUntxIpo2TyJTDSBCEteA9eRbJi0vpcw3AaY9LLW_TXL_pg/exec?id=qlc-0000&mode=mobile";
  var frame = document.getElementById("appFrame");
  var currentIsPhone = null;
  function isPhone(){
    var w = window.innerWidth || document.documentElement.clientWidth || 0;
    var portrait = window.innerHeight > window.innerWidth;
    return (w > 0 && w <= 760) || (portrait && w <= 900);
  }
  function applyMode(){
    var phone = isPhone();
    if (phone === currentIsPhone) return;
    currentIsPhone = phone;
    frame.src = phone ? SP_URL : PC_URL;
  }
  applyMode();
  var resizeTimer;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(applyMode, 300);
  });
})();
</script>
</body>
</html>
