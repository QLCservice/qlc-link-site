<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>包丁研ぎサービス｜QLC Link</title>
</head>
<body>

<style>
  :root{
    --navy:#1C2B40; --navy-light:#2C405C; --brass:#B79358; --brass-light:#D8BD8A;
    --cream:#F6F2EA; --cream-card:#FFFFFF; --charcoal:#33312C; --charcoal-soft:#6B6760;
  }
  *{box-sizing:border-box;}
  .qlcwrap{max-width:700px;margin:0 auto;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;color:var(--charcoal);background:var(--cream);min-height:100vh;}
  .qtop{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#F3EFE6;padding:12px 18px;font-size:13px;}
  .qtop a{color:var(--brass-light);text-decoration:none;font-weight:500;}
  .qtop .brand{font-weight:600;letter-spacing:.04em;}
  .qbody{padding:60px 24px 40px;text-align:center;}
  .qicon{font-size:44px;margin-bottom:18px;}
  .qplaque{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .qplaque::before,.qplaque::after{content:"";flex:1;height:1px;background:var(--brass);opacity:.55;}
  .qplaque span{font-weight:600;font-size:19px;letter-spacing:.06em;color:var(--brass);white-space:nowrap;}
  .qmsg{font-size:14px;line-height:2;color:var(--charcoal);margin-bottom:8px;}
  .qsub{font-size:12.5px;color:var(--charcoal-soft);line-height:1.9;margin-bottom:30px;}
  .qbadge{display:inline-block;background:var(--navy);color:var(--brass-light);font-size:12px;font-weight:600;letter-spacing:.06em;padding:7px 20px;border-radius:20px;margin-bottom:26px;}
  .qback{display:inline-block;border:1.5px solid var(--brass);color:var(--navy);background:transparent;border-radius:18px;padding:12px 26px;font-size:13px;font-weight:500;text-decoration:none;}
</style>
<div class="qlcwrap">
<div class="qtop"><a href="https://www.qlc-service.com/" target="_blank">&#8592; 戻る</a><span class="brand">QLC Link</span></div>
<div class="qbody">
<div class="qicon">🛠️</div>
<div class="qbadge">近日公開</div>
<div class="qplaque"><span>包丁研ぎサービス</span></div>
<div class="qmsg">ただいま、このサービスのご案内ページを準備しております。</div>
<div class="qsub">公開まで今しばらくお待ちください。<br>ご不明な点はお問い合わせよりご連絡ください。</div>
<a class="qback" href="https://www.qlc-service.com/" target="_blank">&#8592; サービス一覧に戻る</a>
</div>
</div>
<script src="/back-nav.js"></script>
<script src="/text-size.js"></script>
</body>
</html>
