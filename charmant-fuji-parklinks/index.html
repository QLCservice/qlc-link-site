const KEY='qlc-gate-'+P.s.slice(0,8);
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFKC')),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.n,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},k,b(P.c));
  document.getElementById('app').innerHTML=new TextDecoder().decode(pt);
  document.getElementById('gate').style.display='none';
}
const err=document.getElementById('err');
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault(); err.textContent='';
  const pw=document.getElementById('pw').value.trim();
  try{ await open(pw); try{localStorage.setItem(KEY,pw);}catch(_){} }
  catch(_){ err.textContent='パスワードが違います。もう一度ご確認ください。'; }
});
try{const s=localStorage.getItem(KEY); if(s) open(s).catch(()=>localStorage.removeItem(KEY));}catch(_){}
</script>
